famous_quotes:
  - "天生我材必有用，千金散尽还复来。"
  - "长风破浪会有时，直挂云帆济沧海。"
  - "举杯邀明月，对影成三人。"
  - "安能摧眉折腰事权贵，使我不得开心颜。"
  - "抽刀断水水更流，举杯消愁愁更愁。"
  - "仰天大笑出门去，我辈岂是蓬蒿人。"
